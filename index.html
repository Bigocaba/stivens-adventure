const T = 16, VH = 270, ROWS = 17, STEP = 1000 / 60;

let bgCache = null, skyCache = null, bgThemeIdx = -1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = Math.max(1, Math.round(window.innerWidth * DPR));
  const h = Math.max(1, Math.round(window.innerHeight * DPR));
  cv.width = w; cv.height = h;
  S = Math.min(h / VH, w / 420);
  VW = w / S; VHv = h / S; OY = VHv - VH;
  PXT = Math.ceil(T * S);
  spr.length = 0; bgCache = null; skyCache = null; bgThemeIdx = -1;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

/* ---------------- utilidades ---------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function txt(c, s, x, y, size, fill, align, stroke, lw) {
  c.font = `800 ${size}px "Trebuchet MS",Verdana,Arial,sans-serif`;
  c.textAlign = align || 'left'; c.textBaseline = 'alphabetic'; c.lineJoin = 'round';
  if (stroke !== null) { c.lineWidth = lw || 3; c.strokeStyle = stroke || '#000'; c.strokeText(s, x, y); }
  c.fillStyle = fill; c.fillText(s, x, y);
}
function heartPath(c, x, y, s) {
  c.beginPath();
  c.moveTo(x, y + s * 0.9);
  c.bezierCurveTo(x - s * 1.5, y - s * 0.2, x - s * 0.6, y - s * 1.2, x, y - s * 0.35);
  c.bezierCurveTo(x + s * 0.6, y - s * 1.2, x + s * 1.5, y - s * 0.2, x, y + s * 0.9);
  c.closePath();
}

const LEVELS = [
  { theme: 0, len: 170, gapMax: 3, dens: 0.8, types: ['E'],           pipes: 0.55, spikes: false, bridge: false, boss: null },
  { theme: 1, len: 190, gapMax: 3, dens: 1.0, types: ['E', 'B'],      pipes: 0.45, spikes: false, bridge: true,  boss: null },
  { theme: 2, len: 190, gapMax: 3, dens: 1.1, types: ['E', 'Q', 'B'], pipes: 0.35, spikes: true,  bridge: true,  boss: 'mini' },
  { theme: 3, len: 210, gapMax: 3, dens: 1.2, types: ['E', 'Q', 'B'], pipes: 0.45, spikes: true,  bridge: true,  boss: null },
  { theme: 4, len: 200, gapMax: 3, dens: 1.3, types: ['Q', 'E', 'B'], pipes: 0.30, spikes: true,  bridge: true,  boss: 'final' }
];
const ARENA = 26;

/* ---------------- generador de niveles (determinista) ---------------- */
function genLevel(n) {
  const cfg = LEVELS[n], rnd = mulberry32(7000 + n * 131);
  const R = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const maxCols = cfg.len + 90 + ARENA;
  const map = Array.from({ length: ROWS }, () => new Array(maxCols).fill(' '));
  const L = { map, cols: 0, spawns: [], coins: [], cps: [], arena: null, goalX: 0, cfg };
  let x = 0, g = 12, midDone = false;
  const ground = (x0, x1, row) => { for (let xx = x0; xx < x1; xx++) for (let y = row; y < ROWS; y++) map[y][xx] = 'G'; };
  const put = (tx, ty, ch) => { if (tx >= 0 && tx < maxCols && ty >= 0 && ty < ROWS) map[ty][tx] = ch; };
  const coin = (tx, ty) => L.coins.push({ x: tx * T + 8, y: ty * T + 8 });
  const spawn = (type, tx, ty) => L.spawns.push({ type, x: tx * T, y: ty * T });

  function flat(len, first) {
    const x0 = x; ground(x0, x0 + len, g); x += len;
    const occ = new Set(), en = [];
    const block = (a, b) => { for (let i = a; i <= b; i++) occ.add(i); };
    if (!midDone && x0 > cfg.len / 2 && len >= 6) {
      const cx = x0 + 2; put(cx, g - 1, 'K'); L.cps.push({ x: cx * T, row: g }); midDone = true; block(cx - 1, cx + 1);
    }
    if (!first && len >= 8 && rnd() < cfg.pipes) {
      const px = x0 + R(3, len - 5), h = R(1, n >= 3 ? 3 : 2);
      for (let k = 1; k <= h; k++) { put(px, g - k, 'P'); put(px + 1, g - k, 'P'); }
      block(px - 2, px + 3);
    }
    if (cfg.spikes && !first && len >= 8 && rnd() < 0.45) {
      const sl = R(1, 3), sx = x0 + R(2, len - sl - 2);
      let free = true; for (let i = sx - 1; i <= sx + sl; i++) if (occ.has(i)) free = false;
      if (free) { for (let i = 0; i < sl; i++) put(sx + i, g - 1, 'X'); block(sx - 2, sx + sl + 1); }
    }
    if (len >= 5 && rnd() < 0.6) {
      const tpls = ['B?B', '?', 'BBB', 'B?B?B', '?B?', 'BH B'.replace(' ', '')];
      const tpl = tpls[R(0, tpls.length - 1)];
      const bx = x0 + R(1, Math.max(1, len - tpl.length - 1));
      let free = true; for (let i = 0; i < tpl.length; i++) if (map[g - 3][bx + i] !== ' ' || occ.has(bx + i) && map[g - 1][bx + i] === 'P') free = false;
      if (free) {
        for (let i = 0; i < tpl.length; i++) {
          let ch = tpl[i]; if (ch === '?') { const q = rnd(); if (q < 0.13) ch = 'H'; else if (q < 0.25) ch = 'N'; }
          put(bx + i, g - 3, ch);
          if (rnd() < 0.5) coin(bx + i, g - 4);
        }
        if (rnd() < 0.3 && tpl.length >= 3) {  // plataforma alta con monedas
          const hx = bx, hl = tpl.length;
          for (let i = 0; i < hl; i++) { put(hx + i, g - 6, 'B'); coin(hx + i, g - 7); }
        }
      }
    }
    if (rnd() < 0.5 && len >= 5) {
      const cn = R(3, 5), cx0 = x0 + R(1, Math.max(1, len - cn - 1));
      for (let i = 0; i < cn; i++) if (map[g - 1][cx0 + i] === ' ') coin(cx0 + i, g - 2);
    }
    if (!first) {
      const cnt = len >= 7 ? Math.floor(rnd() * cfg.dens * 2.2) : (rnd() < 0.3 ? 1 : 0);
      for (let k = 0; k < Math.min(3, cnt); k++) {
        for (let tr = 0; tr < 6; tr++) {
          const ex = x0 + R(2, len - 3);
          if (occ.has(ex) || en.some(v => Math.abs(v - ex) < 3)) continue;
          const type = cfg.types[Math.floor(rnd() * rnd() * cfg.types.length)];
          en.push(ex);
          if (type === 'B') spawn('B', ex, g - 5); else spawn(type, ex, g - 1);
          break;
        }
      }
    }
  }
  function gapSeg(len) {
    const a = x; x += len;
    const cnn = len + 2;
    for (let i = 0; i < cnn; i++) coin(a - 1 + i, g - 2 - Math.round(Math.sin(Math.PI * i / (cnn - 1)) * 2));
  }
  function stepUp(h) { g -= h; }
  function stepDown(h) { g += h; }
  function stairs(up) {
    const k = R(2, 3);
    for (let i = 0; i < k; i++) { g += up ? -1 : 1; ground(x, x + 2, g); x += 2; }
  }
  function bridge() {
    const pcount = R(2, 3);
    for (let i = 0; i < pcount; i++) {
      const gp = R(2, 3), pl = R(2, 3), row = g + (i % 2 === 1 ? -1 : 0);
      x += gp;
      for (let k = 0; k < pl; k++) { put(x + k, row, 'B'); coin(x + k, row - 2); }
      x += pl;
    }
    x += R(2, 3);
  }

  ground(0, 12, g); x = 12;
  let lastGap = false;
  while (x < cfg.len) {
    flat(R(5, 11), false);
    const r = rnd();
    let did = false;
    if (!lastGap && r < 0.34) { gapSeg(R(2, cfg.gapMax)); lastGap = true; did = true; }
    else if (!lastGap && cfg.bridge && r < 0.46) { bridge(); lastGap = true; did = true; }
    else if (r < 0.60) { if (g > 9) { stepUp(R(1, 2)); } else stepDown(1); }
    else if (r < 0.72) { if (g < 13) stepDown(R(1, 2)); else stepUp(1); }
    else if (r < 0.80) { if (g - 3 >= 8 && g <= 12) { stairs(true); } }
    else if (r < 0.88) { if (g + 3 <= 13) { stairs(false); } }
    if (!did) lastGap = false;
    g = clamp(g, 8, 13);
  }
  // normalizar altura a 12 para el final
  flat(4, true);
  while (g !== 12) { g += g > 12 ? -1 : 1; flat(3, true); }

  if (cfg.boss) {
    flat(6, true);
    const cx = x - 4; put(cx, g - 1, 'K'); L.cps.push({ x: cx * T, row: g });
    flat(4, true);
    const x0 = x; ground(x0, x0 + ARENA, g);
    for (let xx = x0 + ARENA; xx < x0 + ARENA + 3; xx++) for (let y = 0; y < ROWS; y++) map[y][xx] = 'G';
    L.arena = { x0, x1: x0 + ARENA, g, kind: cfg.boss };
    x = x0 + ARENA + 3;
  } else {
    flat(14, true);
    L.goalX = (x - 9) * T;
  }
  { // garantiza al menos 2 bloques con estrella por nivel
    let nStar = 0; for (let yy = 0; yy < ROWS; yy++) for (let xx = 0; xx < x; xx++) if (map[yy][xx] === 'N') nStar++;
    if (nStar < 2) {
      const cand = []; for (let xx = 30; xx < x - 12; xx++) for (let yy = 0; yy < ROWS; yy++) if (map[yy][xx] === '?') cand.push([xx, yy]);
      for (let k = 0; k < 2 - nStar && cand.length; k++) { const q = cand.splice(Math.floor(cand.length * (k + 1) / 3), 1)[0]; map[q[1]][q[0]] = 'N'; }
    }
  }
  L.cols = x;
  for (let y = 0; y < ROWS; y++) map[y].length = x;
  return L;
}

/* ---------------- estado global ---------------- */
let state = 'title', stateT = 0, paused = false, tick = 0, shake = 0;
let levelIdx = 0, lvl = null, map = [], cols = 0, curTheme = 0;
let player = null, enemies = [], coins = [], items = [], shots = [], fx = [], bumps = new Map();

try { best = +localStorage.getItem('stivens_best') || 0; } catch (e) {}
const TEST = { invincible: false };

const PW = 11, PH = 18, GU = 0.34, GD = 0.46, JUMP_V = -6.6, MAXV = 2.15, MAXF = 8.5;

function newPlayer() {
  return { x: 32, y: 12 * T - PH, w: PW, h: PH, vx: 0, vy: 0, px: 32, py: 12 * T - PH, face: 1, onGround: false,
    coyote: 0, jumpBuf: 0, jumpT: 0, inv: 0, squash: 0, phase: 0, hp: 3, blink: 0, dead: false };

/* ---------------- entrada ---------------- */
const keys = { left: false, right: false, jump: false };
const kb = { left: false, right: false, jump: false }, tc = { left: false, right: false, jump: false };
let jumpPressed = false;
function syncKeys() {
  const l = kb.left || tc.left, r = kb.right || tc.right, j = kb.jump || tc.jump;
  if (j && !keys.jump) jumpPressed = true;
  keys.left = l; keys.right = r; keys.jump = j;
}
function btnGeom() {
  const m = 16;
  return {
    left: { x: m + 36, y: VHv - m - 38, r: 31 },
    right: { x: m + 36 + 76, y: VHv - m - 38, r: 31 },
    jump: { x: VW - m - 44, y: VHv - m - 46, r: 40 },
    pause: { x: VW - m - 12, y: m + 8, r: 13 },
    mute: { x: VW - m - 12 - 34, y: m + 8, r: 13 }
  };
}
const hit = (b, x, y, k) => (x - b.x) * (x - b.x) + (y - b.y) * (y - b.y) <= (b.r * k) * (b.r * k);
const touches = new Map();
function recomputeTouch() {
  const B = btnGeom(); tc.left = tc.right = tc.jump = false;
  for (const p of touches.values()) {
    if (hit(B.left, p.x, p.y, 1.35)) tc.left = true;
    else if (hit(B.right, p.x, p.y, 1.35)) tc.right = true;
    else if (hit(B.pause, p.x, p.y, 1.5) || hit(B.mute, p.x, p.y, 1.5)) { /* botones de sistema */ }
    else if (p.x > VW * 0.5) tc.jump = true;       // toda la mitad derecha salta
  }
  syncKeys();
}
function uiPoint(t) { return { x: t.clientX * DPR / S, y: t.clientY * DPR / S }; }
function unlockAudio() { Sound.init(); Sound.resume(); }
function onTouchStart(e) {
  e.preventDefault(); unlockAudio();
  const B = btnGeom();
  for (const t of e.changedTouches) {
    const p = uiPoint(t); touches.set(t.identifier, p);
    if (hit(B.pause, p.x, p.y, 1.5)) togglePause();
    else if (hit(B.mute, p.x, p.y, 1.5)) toggleMute();
    else tapAction();
  }
  recomputeTouch();
}
function onTouchMove(e) { e.preventDefault(); for (const t of e.changedTouches) touches.set(t.identifier, uiPoint(t)); recomputeTouch(); }
function onTouchEnd(e) { e.preventDefault(); unlockAudio(); for (const t of e.changedTouches) touches.delete(t.identifier); recomputeTouch(); }
cv.addEventListener('touchstart', onTouchStart, { passive: false });
cv.addEventListener('touchmove', onTouchMove, { passive: false });
cv.addEventListener('touchend', onTouchEnd, { passive: false });
cv.addEventListener('touchcancel', onTouchEnd, { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());
// ratón (para probar en PC)
let mouseDown = false;
cv.addEventListener('mousedown', e => {
  unlockAudio(); mouseDown = true;
  const p = { x: e.clientX * DPR / S, y: e.clientY * DPR / S }, B = btnGeom();
  touches.set('m', p);
  if (hit(B.pause, p.x, p.y, 1.5)) togglePause(); else if (hit(B.mute, p.x, p.y, 1.5)) toggleMute(); else tapAction();
  recomputeTouch();
});
cv.addEventListener('mousemove', e => { if (mouseDown) { touches.set('m', { x: e.clientX * DPR / S, y: e.clientY * DPR / S }); recomputeTouch(); } });
addEventListener('mouseup', () => { mouseDown = false; touches.delete('m'); recomputeTouch(); });
addEventListener('keydown', e => {
  unlockAudio();
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA') kb.left = true;
  else if (c === 'ArrowRight' || c === 'KeyD') kb.right = true;
  else if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW' || c === 'KeyZ') kb.jump = true;
  else if (c === 'Enter') tapAction();
  else if (c === 'KeyP' || c === 'Escape') togglePause();
  else if (c === 'KeyM') toggleMute();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(c)) e.preventDefault();
  syncKeys();
});
addEventListener('keyup', e => {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA') kb.left = false;
  else if (c === 'ArrowRight' || c === 'KeyD') kb.right = false;
  else if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW' || c === 'KeyZ') kb.jump = false;
  syncKeys();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (state === 'play') paused = true; Sound.suspend(); }
  else Sound.resume();
});

/* ---------------- sonido y música ---------------- */
const SC = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
  pdom: [0, 1, 4, 5, 7, 8, 10], harm: [0, 2, 3, 5, 7, 8, 11], phry: [0, 1, 3, 5, 7, 8, 10] };
const ds = (d, sc) => sc[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7);
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const MEL_A = [[9, null, 11, 9, 7, null, 8, 9], [8, null, 11, 8, 6, null, 8, 11], [7, null, 9, 12, 11, null, 9, 7],

const CH_A = [0, 4, 5, 3, 3, 4, 0, 0];
const arpLead = pat => (b, k, ch) => { const v = pat[k]; return v == null ? null : ch[b] + 7 + v; };
const SONGS = {
  day:    { bpm: 132, root: 60, sc: SC.major,  ch: CH_A, lead: (b, k) => MEL_A[b][k], lw: 'square',   lv: 0.050, bass: [1, 0, 2, 0, 1, 0, 2, 0], bv: 0.15, drum: 'basic' },
  cave:   { bpm: 92,  root: 57, sc: SC.minor,  ch: [0, 5, 3, 4, 0, 5, 3, 4], lead: arpLead([0, null, 2, null, 4, null, 2, null]), lw: 'triangle', lv: 0.12, bass: [1, 0, 0, 0, 2, 0, 0, 0], bv: 0.15, drum: 'soft' },

/* ---- escena ---- */
function drawScene(alpha, camX, shx, shy, showPlayer) {
  const th = THEMES[curTheme];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(skyCache, 0, 0);
  drawStrip({ k: bgCache.far, W: bgCache.W }, 0.18, camX);
  // nubes
  if (th.id === 'day' || th.id === 'snow' || th.id === 'desert') {
    ctx.setTransform(S, 0, 0, S, 0, OY * S); ctx.fillStyle = th.id === 'desert' ? 'rgba(255,240,210,0.55)' : 'rgba(255,255,255,0.85)';
    for (let i = 0; i < 7; i++) {
      const wx = ((i * 190 - camX * 0.3 + tick * 0.05) % (VW + 200) + (VW + 200)) % (VW + 200) - 100, wy = 24 + (i * 37) % 70;
      ctx.beginPath(); ctx.arc(wx, wy, 11, 0, 7); ctx.arc(wx + 13, wy - 6, 14, 0, 7); ctx.arc(wx + 29, wy - 1, 12, 0, 7); ctx.arc(wx + 40, wy + 3, 8, 0, 7); ctx.rect(wx, wy, 40, 11); ctx.fill();
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  drawStrip({ k: bgCache.near, W: bgCache.W }, 0.5, camX);
  // lava
  if (th.lava) {
    ctx.setTransform(S, 0, 0, S, 0, (OY + shy) * S);
    const ly = ROWS * T - 14, g = ctx.createLinearGradient(0, ly, 0, ly + 30); g.addColorStop(0, '#ffb03a'); g.addColorStop(1, '#c4260a');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, ly + 40);
    for (let x = 0; x <= VW + 8; x += 8) ctx.lineTo(x, ly + Math.sin((x + camX * 0.8) * 0.06 + tick * 0.08) * 2.5);
    ctx.lineTo(VW + 8, ly + 40); ctx.closePath(); ctx.fill(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  // tiles
  const tx0 = Math.max(0, Math.floor(camX / T)), tx1 = Math.min(cols - 1, Math.ceil((camX + VW) / T));
  for (let ty = 0; ty < ROWS; ty++) {
    const sy0 = Math.round((ty * T + OY + shy) * S), sy1 = Math.round(((ty + 1) * T + OY + shy) * S);
    for (let tx = tx0; tx <= tx1; tx++) {
      const ch = map[ty][tx]; if (ch === ' ' || ch === 'K') continue;
      const key = tileKeyFor(tx, ty, ch); if (key < 0) continue;
      let bo = 0; const bv = bumps.get(tx + ',' + ty); if (bv) bo = -Math.sin((bv / 12) * Math.PI) * 5 * S;
      const sx0 = Math.round((tx * T - camX + shx) * S), sx1 = Math.round(((tx + 1) * T - camX + shx) * S);
      ctx.drawImage(tileSprite(curTheme, key), sx0, sy0 + bo, sx1 - sx0, sy1 - sy0);
    }
  }
  // entidades (coordenadas de mundo)
  ctx.setTransform(S, 0, 0, S, (-camX + shx) * S, (OY + shy) * S);
  // decoración y checkpoints
  for (let tx = tx0; tx <= tx1; tx++) for (let ty = 0; ty < ROWS; ty++) {
    const ch = map[ty][tx];
    if (ch === 'K') { const on = activeCp && activeCp.x >= tx * T; drawFlag(ctx, tx * T, (ty + 1) * T, on ? '#3dd16a' : '#8a8a96', tick, false); }
    else if (ch === 'G' && ty > 0 && map[ty - 1][tx] === ' ') {
      const h = (tx * 31 + ty * 17) % 11;
      if (th.id === 'day' && h === 0) { ctx.fillStyle = '#ff5a8a'; ctx.beginPath(); ctx.arc(tx * T + 8, ty * T - 3, 2.2, 0, 7); ctx.fill(); ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.arc(tx * T + 8, ty * T - 3, 0.9, 0, 7); ctx.fill(); ctx.fillStyle = '#2d8f37'; ctx.fillRect(tx * T + 7.5, ty * T - 2, 1, 2); }
      else if (th.id === 'day' && h === 4) { ctx.fillStyle = '#3cae44'; ctx.beginPath(); ctx.moveTo(tx * T + 4, ty * T); ctx.lineTo(tx * T + 5.5, ty * T - 5); ctx.lineTo(tx * T + 7, ty * T); ctx.lineTo(tx * T + 8.5, ty * T - 6); ctx.lineTo(tx * T + 10, ty * T); ctx.fill(); }
      else if (th.id === 'snow' && h === 2) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(tx * T + 8, ty * T, 6, 3, 0, Math.PI, 0); ctx.fill(); }
      else if (th.id === 'desert' && h === 3) { ctx.fillStyle = '#b8884a'; ctx.beginPath(); ctx.ellipse(tx * T + 8, ty * T, 4, 2.6, 0, Math.PI, 0); ctx.fill(); }
      else if (th.id === 'cave' && h === 5) { ctx.save(); ctx.shadowColor = '#6ff0ff'; ctx.shadowBlur = 6; ctx.fillStyle = '#6ff0ff'; ctx.beginPath(); ctx.moveTo(tx * T + 5, ty * T); ctx.lineTo(tx * T + 7, ty * T - 7); ctx.lineTo(tx * T + 9, ty * T); ctx.fill(); ctx.restore(); }
    }
  }
  if (goal) {
    drawCastleGoal(ctx, goal.x + 18, Math.round(12 * T));
    drawFlag(ctx, goal.x, 12 * T, goal.active ? '#e23b3b' : '#e23b3b', tick, true);
  }
  for (const c of coins) if (!c.got && c.x > camX - 20 && c.x < camX + VW + 20) drawCoin(ctx, c.x, c.y, tick + c.t * 10);
  for (const it of items) { if (it.type === 'star') drawStarItem(ctx, it.x, it.y, tick); else drawHeartItem(ctx, it.x, it.y, tick); }
  for (const e of enemies) {
    const ex = lerp(e.px, e.x, alpha), ey = lerp(e.py, e.y, alpha);
    if (ex < camX - 40 || ex > camX + VW + 40) continue;

    if (e.type === 'E') drawMush(ctx, e, th, ex, ey, dk); else if (e.type === 'Q') drawSpiky(ctx, e, ex, ey, dk); else drawBat(ctx, e, ex, ey, dk);
  }

  for (const s of shots) {
    if (s.t === 'rock' && s.warn > 0) {
      const gy = lvl.arena.g * T; ctx.fillStyle = 'rgba(255,60,40,' + (0.35 + 0.35 * Math.sin(tick * 0.5)) + ')'; ctx.beginPath(); ctx.ellipse(s.x + 7, gy - 1, 10, 3, 0, 0, 7); ctx.fill();
    } else drawShot(ctx, s, lerp(s.px || s.x, s.x, alpha), lerp(s.py || s.y, s.y, alpha));
  }
  if (showPlayer && player) {
    const p = player, px = lerp(p.px, p.x, alpha), py = lerp(p.py, p.y, alpha);
    if (p.star > 0 && !(p.star < 120 && Math.floor(tick / 5) % 2 === 0)) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const hu = (tick * 10) % 360, gx = px + p.w / 2, gy = py + p.h / 2, gr = ctx.createRadialGradient(gx, gy, 2, gx, gy, 26);
      gr.addColorStop(0, 'hsla(' + hu + ',100%,60%,0.65)'); gr.addColorStop(1, 'hsla(' + hu + ',100%,60%,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(gx, gy, 26, 0, 7); ctx.fill(); ctx.restore();
    }
    if (!(p.inv > 0 && state === 'play' && Math.floor(tick / 4) % 2 === 0)) drawStivens(ctx, px + p.w / 2, py + p.h, p);
  }
  // fx
  for (const f of fx) {
    const a = clamp(f.life / f.max, 0, 1);
    if (f.t === 'x') { ctx.globalAlpha = Math.min(1, a * 1.6); txt(ctx, f.s, f.x, f.y, 8, f.c, 'center', '#000', 2.4); ctx.globalAlpha = 1; }
    else if (f.t === 'c') { drawCoin(ctx, f.x, f.y, tick * 3); }
    else { ctx.globalAlpha = a; ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x, f.y, f.s * (f.t === 'd' ? (1.4 - a * 0.5) : 1), 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
  }
  // ambiente (espacio de pantalla)
  ctx.setTransform(S, 0, 0, S, 0, 0);
  for (const a of amb) {
    if (th.amb === 'snow') { ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 7); ctx.fill(); }

    else if (th.amb === 'sparkle') { ctx.fillStyle = 'rgba(180,230,255,' + (0.3 + 0.4 * Math.sin(a.ph * 2)) + ')'; ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 0.8, 0, 7); ctx.fill(); }
    else { ctx.fillStyle = 'rgba(255,250,200,' + (0.35 + 0.3 * Math.sin(a.ph * 2)) + ')'; ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 0.7, 0, 7); ctx.fill(); }
  }
  // viñeta suave
  const vg = ctx.createRadialGradient(VW / 2, VHv / 2, VHv * 0.55, VW / 2, VHv / 2, VHv * 1.15); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.28)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VHv);
}

  else if (kind === 'pause') { c.fillRect(b.x - 4, b.y - 5, 3, 10); c.fillRect(b.x + 1.5, b.y - 5, 3, 10); }
  else if (kind === 'mute') {
    c.beginPath(); c.moveTo(b.x - 5, b.y - 2); c.lineTo(b.x - 2, b.y - 2); c.lineTo(b.x + 2, b.y - 5); c.lineTo(b.x + 2, b.y + 5); c.lineTo(b.x - 2, b.y + 2); c.lineTo(b.x - 5, b.y + 2); c.closePath(); c.fill();
    c.lineWidth = 1.6; if (Sound.muted) { c.beginPath(); c.moveTo(b.x + 4, b.y - 3); c.lineTo(b.x + 8, b.y + 3); c.moveTo(b.x + 8, b.y - 3); c.lineTo(b.x + 4, b.y + 3); c.stroke(); }
    else { c.beginPath(); c.arc(b.x + 2, b.y, 4.2, -0.9, 0.9); c.stroke(); }
  }
  c.restore();
}
function drawHUD() {
  const c = ctx, m = 16, p = player; c.setTransform(S, 0, 0, S, 0, 0);
  for (let i = 0; i < 3; i++) {
    const full = p && i < p.hp; c.fillStyle = full ? '#ff4f7a' : 'rgba(0,0,0,0.45)'; heartPath(c, m + 8 + i * 17, 20, 6.4); c.fill();
    c.lineWidth = 1.2; c.strokeStyle = full ? '#8a1a3a' : '#000'; c.stroke();
  }
  c.save(); c.translate(m + 6, 38); c.fillStyle = '#ffc61a'; c.beginPath(); c.arc(0, 0, 5, 0, 7); c.fill(); c.strokeStyle = '#a86400'; c.lineWidth = 1; c.stroke(); c.restore();
  txt(c, '×' + coinCount, m + 15, 42, 11, '#fff', 'left');
  c.save(); c.translate(m + 56, 38); c.fillStyle = COSTUMES[costumeIdx].shirt; rr(c, -3.4, 3, 6.8, 3, 1.2); c.fill(); c.fillStyle = '#f5c28b'; c.beginPath(); c.arc(0, 0, 4.9, 0, 7); c.fill(); c.lineWidth = 0.8; c.strokeStyle = '#1d1d26'; c.stroke(); c.fillStyle = 'rgba(255,255,255,0.6)'; c.beginPath(); c.ellipse(-0.8, -2.6, 1.9, 0.9, -0.2, 0, 7); c.fill(); c.restore();
  txt(c, '×' + Math.max(0, lives), m + 66, 42, 11, '#fff', 'left');
  if (p && p.star > 0) {
    const k = p.star / STAR_TIME; c.fillStyle = '#ffd91a'; starPath(c, m + 7, 57, 6.5, 3); c.fill(); c.lineWidth = 0.8; c.strokeStyle = '#a86400'; c.stroke();
    c.fillStyle = 'rgba(0,0,0,0.5)'; rr(c, m + 17, 53.5, 74, 7, 3.5); c.fill();
    c.fillStyle = 'hsl(' + ((tick * 10) % 360) + ',100%,60%)'; rr(c, m + 18, 54.5, Math.max(0, 72 * k), 5, 2.5); c.fill();
  }
  txt(c, String(score).padStart(7, '0'), VW / 2, 22, 15, '#fff', 'center');
  txt(c, (levelIdx + 1) + ' · ' + THEMES[curTheme].name, VW / 2, 36, 10, '#ffe9a8', 'center');
  const B = btnGeom();
  if (state === 'play' || state === 'intro' || state === 'dead') {
    drawButton(c, B.left, keys.left, 'left'); drawButton(c, B.right, keys.right, 'right'); drawButton(c, B.jump, keys.jump, 'jump');
  }
  drawButton(c, B.pause, false, 'pause'); drawButton(c, B.mute, false, 'mute');
  if (boss && boss.active && !boss.dead) {
    const w = Math.min(240, VW * 0.5), x = VW / 2 - w / 2, y = 50;
    txt(c, boss.name, VW / 2, y - 3, 10, '#ffd0d0', 'center');
    c.fillStyle = 'rgba(0,0,0,0.55)'; rr(c, x - 2, y, w + 4, 11, 5); c.fill();
    const k = clamp(boss.hp / boss.maxHp, 0, 1), g = c.createLinearGradient(0, y, 0, y + 11); g.addColorStop(0, '#ff7a7a'); g.addColorStop(1, '#c41e1e');
    c.fillStyle = g; rr(c, x, y + 2, Math.max(0, w * k), 7, 3.5); c.fill();
  }
}
function banner(title, sub, t, total) {
  const a = t < 20 ? t / 20 : t > total - 20 ? (total - t) / 20 : 1; if (a <= 0) return;
  const c = ctx; c.setTransform(S, 0, 0, S, 0, 0); c.globalAlpha = clamp(a, 0, 1);
  c.fillStyle = 'rgba(0,0,0,0.5)'; c.fillRect(0, VHv * 0.3, VW, 62);
  txt(c, title, VW / 2, VHv * 0.3 + 28, 24, '#ffd24d', 'center', '#3a1a00', 4);
  if (sub) txt(c, sub, VW / 2, VHv * 0.3 + 50, 12, '#fff', 'center');
  c.globalAlpha = 1;
}
function overlayText(lines, color) {
  const c = ctx; c.setTransform(S, 0, 0, S, 0, 0); c.fillStyle = 'rgba(0,0,0,0.58)'; c.fillRect(0, 0, VW, VHv);
  let y = VHv / 2 - (lines.length - 1) * 14;
  lines.forEach((l, i) => { txt(c, l.s, VW / 2, y, l.size, l.col || '#fff', 'center', '#000', 4); y += l.size + 10; });
}

function render(alpha) {
  ensureBG();
  const sh = shake > 0 ? shake : 0, shx = sh ? (Math.random() - 0.5) * sh * 0.8 : 0, shy = sh ? (Math.random() - 0.5) * sh * 0.8 : 0;
  const camX = lerp(cam.px, cam.x, alpha);
  if (state === 'title') {
    const tcx = titleCam;
    const savedCols = cols; // el fondo del título usa el nivel 1 desplazándose
    drawScene(alpha, tcx % Math.max(1, (cols - VW - 40)), 0, 0, false);
    ctx.setTransform(S, 0, 0, S, 0, 0);
    const gy = 12 * T + OY;
    // Stivens corriendo
    ctx.save(); ctx.translate(VW * 0.5 - 6, gy); ctx.scale(3, 3);
    drawStivens(ctx, 0, 0, { face: 1, vx: 2, vy: 0, onGround: true, phase: tick * 0.22, squash: 0, dead: false, costume: 0 });
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,0.30)'; ctx.fillRect(0, 0, VW, VHv);
    const ty = VHv * 0.28;
    ctx.save(); ctx.translate(VW / 2, ty); ctx.rotate(-0.03);
    ctx.font = '900 54px "Trebuchet MS",Verdana,Arial,sans-serif'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    const g = ctx.createLinearGradient(0, -44, 0, 6); g.addColorStop(0, '#fff5a0'); g.addColorStop(1, '#ff9a1a');
    ctx.lineWidth = 9; ctx.strokeStyle = '#3a1a00'; ctx.strokeText('STIVENS', 0, 0); ctx.fillStyle = g; ctx.fillText('STIVENS', 0, 0);
    ctx.font = '900 26px "Trebuchet MS",Verdana,Arial,sans-serif'; ctx.lineWidth = 6; ctx.strokeStyle = '#0c3a66'; ctx.strokeText('ADVENTURE', 0, 30); ctx.fillStyle = '#7fdcff'; ctx.fillText('ADVENTURE', 0, 30);
    ctx.restore();
    if (Math.floor(tick / 30) % 2 === 0) txt(ctx, 'TOCA LA PANTALLA PARA JUGAR', VW / 2, VHv - 54, 14, '#fff', 'center');
    txt(ctx, 'MEJOR PUNTAJE: ' + String(best).padStart(7, '0'), VW / 2, VHv - 34, 10, '#ffe9a8', 'center');
    txt(ctx, '◀ ▶ mover      mitad derecha de la pantalla = saltar', VW / 2, VHv - 16, 9, '#dff', 'center');
    drawButton(ctx, btnGeom().mute, false, 'mute');
    return;
  }
  drawScene(alpha, camX, shx, shy, true);
  drawHUD();
  if (state === 'intro') {
    const lv = LEVELS[levelIdx];
    banner('NIVEL ' + (levelIdx + 1), THEMES[curTheme].name + (lv.boss ? '  ·  ¡JEFE AL FINAL!' : '') + (levelIdx === 0 ? '   —   Salta sobre los enemigos' : ''), stateT, 130);
  }
  if (bossBanner > 0) banner('¡JEFE!', boss.name, 150 - bossBanner, 150);
  if (state === 'clear') {
    overlayText([{ s: '¡NIVEL COMPLETADO!', size: 26, col: '#ffd24d' }, { s: 'Bonus +' + (clearInfo ? clearInfo.bonus : 0), size: 14 },
      { s: levelIdx + 1 < LEVELS.length ? 'Nuevo disfraz: ' + COSTUMES[levelIdx + 1].name + '!' : ' ', size: 14, col: '#9bff9b' },
      { s: stateT > 50 ? 'Toca para continuar' : ' ', size: 12 }]);
  }
  if (state === 'gameover') overlayText([{ s: 'GAME OVER', size: 34, col: '#ff6b6b' }, { s: 'Puntos: ' + score, size: 14 }, { s: stateT > 70 ? 'Toca para volver al inicio' : ' ', size: 12 }]);
  if (state === 'win') overlayText([{ s: '¡STIVENS SALVÓ EL REINO!', size: 24, col: '#ffd24d' }, { s: 'Puntos: ' + score + '   Mejor: ' + best, size: 14 }, { s: stateT > 120 ? 'Toca para volver al inicio' : ' ', size: 12 }]);
  if (paused) overlayText([{ s: 'PAUSA', size: 34, col: '#fff' }, { s: 'Toca para continuar', size: 12 }]);
}

/* ---------------- bucle principal (paso fijo) ---------------- */
let lastT = performance.now(), acc = 0;
function frame(now) {
  let dt = now - lastT; lastT = now; if (dt > 100) dt = 100; acc += dt;
  let n = 0;
  while (acc >= STEP && n < 5) { update(); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  render(acc / STEP);
  requestAnimationFrame(frame);
}
/* limpia el service worker/cache de la version 1 para que siempre cargue esta version */
try {
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
} catch (e) {}
loadLevel(0);
Sound.play('day');
requestAnimationFrame(frame);

/* utilidad de pruebas */
function debugStart(n) { score = 0; lives = 5; coinCount = 0; loadLevel(n); setState('play'); }
</script>
