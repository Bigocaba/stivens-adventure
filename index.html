<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stivens Adventure</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5ec8ff">
<link rel="icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 480, H = 270, T = 16;           // resolución lógica y tamaño de tile
cv.width = W; cv.height = H;

// ---------- Nivel ----------
// G=suelo, B=ladrillo, ?=bloque moneda, C=moneda, E=enemigo, F=bandera, P=tubo
const LEVELS = [
[
"                                                                                          ",
"                                                                                          ",
"                                                                                          ",
"                                                                                          ",
"                       C C C                         C C                                  ",
"                                                    BBBBB            C C C                ",
"              ?                       ?                                                   ",
"                   BB?BB                                    BBB?B                       F ",
"                                                                                        F ",
"          C                  E                    E  C            E                     F ",
"      E       PP         E  GGGG    PP     E   GGGGGG   PP    E       GGGG   E          F ",
"GGGGGGGGGGGGGGGGGG   GGGGGGGGGGGGGGGGGGGGGGGGG   GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
"GGGGGGGGGGGGGGGGGG   GGGGGGGGGGGGGGGGGGGGGGGGG   GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
],
[
"                                                                                          ",
"                                                                                          ",
"                C C C                                  C C C C                            ",
"                                                                                          ",
"            BBB                 BBBBB          ?               BBB                        ",
"                   ?                                                  C C                 ",
"       C                                  BBB                                             ",
"                       E                           E                  BBBB              F ",
"     E        BBBB    GGG           E     GGG      GGG        E                         F ",
"            E                      GGGG                              E     PP           F ",
"      PP        E         PP      GGGGG    PP         E     PP  GGGG     GGGGG         F ",
"GGGGGGGGGGG   GGGGGGG   GGGGGGG   GGGGGGGGGGGGG   GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
"GGGGGGGGGGG   GGGGGGG   GGGGGGG   GGGGGGGGGGGGG   GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
]
];

let level = 0, map, enemies, coinsList, flag;
let score = 0, lives = 3, coinsGot = 0;
let state = 'title'; // title, play, dead, win, over, next
let camX = 0, stateTimer = 0;

const player = {x:0,y:0,w:12,h:16,vx:0,vy:0,onGround:false,face:1,anim:0,inv:0};

function loadLevel(n){
  const rows = LEVELS[n];
  map = rows.map(r => r.split(''));
  enemies = []; coinsList = []; flag = null;
  for (let y=0;y<map.length;y++) for (let x=0;x<map[y].length;x++){
    const c = map[y][x];
    if (c==='E'){ enemies.push({x:x*T+2,y:y*T+2,w:12,h:14,vx:-0.5,alive:true,squash:0}); map[y][x]=' '; }
    if (c==='C'){ coinsList.push({x:x*T+4,y:y*T+3,got:false}); map[y][x]=' '; }
    if (c==='F'){ if(!flag) flag={x:x*T, y:y*T}; map[y][x]='F'; }
  }
  resetPlayer();
}
function resetPlayer(){
  player.x = 2*T; player.y = 8*T; player.vx = player.vy = 0; player.inv = 90; camX = 0;
}
const rows = () => map.length, cols = () => map[0].length;
function tileAt(tx,ty){
  if (tx<0) return 'G';
  if (ty<0) return ' ';
  if (ty>=rows()||tx>=cols()) return ' ';
  return map[ty][tx] || ' ';
}
const solid = c => c==='G'||c==='B'||c==='?'||c==='P'||c==='U';

// ---------- Input ----------
const keys = {left:false,right:false,jump:false};
let jumpPressed = false;
addEventListener('keydown',e=>{
  if (e.code==='ArrowLeft'||e.code==='KeyA') keys.left=true;
  if (e.code==='ArrowRight'||e.code==='KeyD') keys.right=true;
  if (e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){ if(!keys.jump) jumpPressed=true; keys.jump=true; }
  if (e.code==='Enter') action();
});
addEventListener('keyup',e=>{
  if (e.code==='ArrowLeft'||e.code==='KeyA') keys.left=false;
  if (e.code==='ArrowRight'||e.code==='KeyD') keys.right=false;
  if (e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') keys.jump=false;
});
// Botones táctiles (en coordenadas lógicas)
const btns = {
  left:{x:12,y:H-62,w:50,h:50,t:'◀'},
  right:{x:72,y:H-62,w:50,h:50,t:'▶'},
  jump:{x:W-72,y:H-68,w:60,h:60,t:'▲'}
};
const touches = {};
function pt(e,t){ const r=cv.getBoundingClientRect(); return {x:(t.clientX-r.left)/r.width*W, y:(t.clientY-r.top)/r.height*H}; }
function recompute(){
  keys.left=keys.right=false; let j=false;
  for (const id in touches){
    const p=touches[id];
    for (const k in btns){
      const b=btns[k];
      if (p.x>=b.x-8&&p.x<=b.x+b.w+8&&p.y>=b.y-8&&p.y<=b.y+b.h+8){
        if(k==='jump') j=true; else keys[k]=true;
      }
    }
  }
  if (j && !keys.jump) jumpPressed=true;
  keys.jump=j;
}
function tstart(e){ e.preventDefault(); for(const t of e.changedTouches) touches[t.identifier]=pt(e,t); recompute(); if(state!=='play') action(); }
function tmove(e){ e.preventDefault(); for(const t of e.changedTouches) touches[t.identifier]=pt(e,t); recompute(); }
function tend(e){ e.preventDefault(); for(const t of e.changedTouches) delete touches[t.identifier]; recompute(); }
cv.addEventListener('touchstart',tstart,{passive:false});
cv.addEventListener('touchmove',tmove,{passive:false});
cv.addEventListener('touchend',tend,{passive:false});
cv.addEventListener('touchcancel',tend,{passive:false});
cv.addEventListener('mousedown',()=>{ if(state!=='play') action(); });

function action(){
  if (stateTimer<30) return;
  if (state==='title'){ score=0;lives=3;coinsGot=0;level=0;loadLevel(0);state='play';stateTimer=0; }
  else if (state==='over'||state==='win'){ state='title'; stateTimer=0; }
  else if (state==='next'){ level++; loadLevel(level); state='play'; stateTimer=0; }
}

// ---------- Audio simple ----------
let ac;
function beep(f,d=0.1,type='square',v=0.05){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.value=f; g.gain.value=v;
    o.connect(g); g.connect(ac.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+d); o.stop(ac.currentTime+d);
  }catch(e){}
}

// ---------- Física ----------
function moveAxis(ent, dx, dy){
  // X
  ent.x += dx;
  let x0=Math.floor(ent.x/T), x1=Math.floor((ent.x+ent.w-1)/T);
  let y0=Math.floor(ent.y/T), y1=Math.floor((ent.y+ent.h-1)/T);
  let hitX=false;
  for (let ty=y0;ty<=y1;ty++) for (let tx=x0;tx<=x1;tx++){
    if (solid(tileAt(tx,ty))){
      hitX=true;
      if (dx>0) ent.x = tx*T-ent.w; else if (dx<0) ent.x=(tx+1)*T;
      x0=Math.floor(ent.x/T); x1=Math.floor((ent.x+ent.w-1)/T);
    }
  }
  // Y
  ent.y += dy;
  x0=Math.floor(ent.x/T); x1=Math.floor((ent.x+ent.w-1)/T);
  y0=Math.floor(ent.y/T); y1=Math.floor((ent.y+ent.h-1)/T);
  let ground=false, bumped=null;
  for (let ty=y0;ty<=y1;ty++) for (let tx=x0;tx<=x1;tx++){
    if (solid(tileAt(tx,ty))){
      if (dy>0){ ent.y=ty*T-ent.h; ground=true; ent.vy=0; }
      else if (dy<0){ ent.y=(ty+1)*T; ent.vy=0; bumped={tx,ty}; }
      y0=Math.floor(ent.y/T); y1=Math.floor((ent.y+ent.h-1)/T);
    }
  }
  return {hitX,ground,bumped};
}

function die(){
  state='dead'; stateTimer=0; lives--; beep(150,0.5,'sawtooth',0.07);
  player.vy=-5;
}

function update(){
  stateTimer++;
  if (state==='play'){
    // movimiento horizontal
    const acc=0.4, max=2.2, fr=0.82;
    if (keys.left){ player.vx-=acc; player.face=-1; }
    else if (keys.right){ player.vx+=acc; player.face=1; }
    else player.vx*=fr;
    player.vx=Math.max(-max,Math.min(max,player.vx));
    if (Math.abs(player.vx)<0.05) player.vx=0;
    // salto
    if (jumpPressed && player.onGround){ player.vy=-6.2; player.onGround=false; beep(520,0.12); }
    jumpPressed=false;
    if (!keys.jump && player.vy<-2.5) player.vy=-2.5; // salto variable
    player.vy=Math.min(player.vy+0.32,7);
    const r1=moveAxis(player,player.vx,0);
    const r2=moveAxis(player,0,player.vy);
    player.onGround=r2.ground;
    if (r1.hitX) player.vx=0;
    if (r2.bumped){
      const {tx,ty}=r2.bumped;
      if (map[ty][tx]==='?'){ map[ty][tx]='U'; score+=100; coinsGot++; beep(880,0.15); coinsList.push({x:tx*T+4,y:(ty-1)*T,got:false,pop:20}); }
      else if (map[ty][tx]==='B'){ beep(200,0.06); }
    }
    player.anim += Math.abs(player.vx)*0.15;
    if (player.inv>0) player.inv--;
    if (player.y>rows()*T+40) die();

    // monedas
    for (const c of coinsList){
      if (c.got) continue;
      if (c.pop){ c.pop--; if(c.pop<=0) c.got=true; continue; }
      if (player.x<c.x+8&&player.x+player.w>c.x&&player.y<c.y+10&&player.y+player.h>c.y){
        c.got=true; score+=100; coinsGot++; beep(1000,0.1,'triangle');
      }
    }
    // enemigos
    for (const e of enemies){
      if (!e.alive){ if(e.squash>0) e.squash--; continue; }
      e.x+=e.vx;
      const ahead = e.vx>0 ? e.x+e.w : e.x;
      const tx=Math.floor(ahead/T), ty=Math.floor((e.y+e.h/2)/T);
      const below=tileAt(tx,Math.floor((e.y+e.h+2)/T));
      if (solid(tileAt(tx,ty)) || !solid(below)) e.vx*=-1;
      // gravedad simple
      const feet=tileAt(Math.floor((e.x+e.w/2)/T),Math.floor((e.y+e.h)/T));
      if(!solid(feet)) e.y+=2;
      // colisión con el jugador
      if (player.x<e.x+e.w&&player.x+player.w>e.x&&player.y<e.y+e.h&&player.y+player.h>e.y){
        if (player.vy>0 && player.y+player.h-e.y<12){
          e.alive=false; e.squash=20; player.vy=-4.5; score+=200; beep(300,0.12,'square');
        } else if (player.inv<=0){ die(); }
      }
    }
    // meta
    if (flag && player.x+player.w>flag.x){
      score+=1000; beep(660,0.4,'triangle');
      if (level<LEVELS.length-1){ state='next'; } else { state='win'; }
      stateTimer=0;
    }
    // cámara
    camX = Math.max(0, Math.min(player.x-W/2, cols()*T-W));
  }
  else if (state==='dead'){
    player.vy+=0.3; player.y+=player.vy;
    if (stateTimer>90){
      if (lives<=0){ state='over'; stateTimer=0; }
      else { loadLevel(level); state='play'; }
    }
  }
}

// ---------- Dibujo ----------
function rect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); }
function text(s,x,y,size=12,color='#fff',align='left'){
  ctx.font=`bold ${size}px monospace`; ctx.textAlign=align; ctx.fillStyle='#000';
  ctx.fillText(s,x+1,y+1); ctx.fillStyle=color; ctx.fillText(s,x,y);
}

function drawStivens(x,y,face,anim,air,inv){
  if (inv>0 && Math.floor(inv/4)%2) return;
  ctx.save(); ctx.translate(Math.round(x+6),Math.round(y)); ctx.scale(face,1);
  // gorra verde
  rect(-6,0,12,4,'#2e9e3f'); rect(-1,2,9,2,'#2e9e3f');
  // cara
  rect(-5,4,10,5,'#f5c28b'); rect(2,5,2,2,'#222'); rect(-1,8,6,1,'#6b3b1a');
  // camiseta amarilla
  rect(-6,9,12,4,'#f2c21b');
  // overol azul
  rect(-5,11,10,3,'#2a62d6'); rect(-3,9,2,3,'#2a62d6'); rect(2,9,2,3,'#2a62d6');
  // piernas
  const s = air ? 0 : Math.floor(anim)%2;
  rect(-5,14+(s?0:0),4,2,'#5a3a1d'); rect(1,14,4,2,'#5a3a1d');
  if(!air && s){ rect(-5,14,4,2,'#2a62d6'); rect(1,14,4,2,'#5a3a1d'); }
  ctx.restore();
}

function draw(){
  // cielo
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#5ec8ff'); g.addColorStop(1,'#cdeeff');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  if (state==='title'){ drawTitle(); return; }

  // nubes (parallax)
  for (let i=0;i<8;i++){
    const cx=((i*170)-camX*0.4)%(W+120); const px=cx<-60?cx+W+120:cx;
    rect(px,30+(i%3)*25,40,10,'#fff'); rect(px+8,24+(i%3)*25,24,8,'#fff');
  }
  ctx.save(); ctx.translate(-Math.round(camX),0);
  const x0=Math.floor(camX/T), x1=x0+Math.ceil(W/T)+1;
  for (let ty=0;ty<rows();ty++) for (let tx=x0;tx<=x1;tx++){
    const c=tileAt(tx,ty); const px=tx*T, py=ty*T;
    if (c==='G'){ rect(px,py,T,T,'#b5651d'); if(tileAt(tx,ty-1)!=='G') rect(px,py,T,4,'#3cb043'); rect(px+2,py+8,3,3,'#8a4a12'); rect(px+10,py+11,3,3,'#8a4a12'); }
    else if (c==='B'){ rect(px,py,T,T,'#c0602a'); rect(px,py+7,T,1,'#7a3512'); rect(px+7,py,1,8,'#7a3512'); rect(px+3,py+8,1,8,'#7a3512'); }
    else if (c==='?'){ rect(px,py,T,T,'#f2b01b'); rect(px+1,py+1,T-2,T-2,'#ffd34d'); text('?',px+8,py+13,12,'#8a4a00','center'); }
    else if (c==='U'){ rect(px,py,T,T,'#7a6a55'); }
    else if (c==='P'){ rect(px,py,T,T,'#2fa84f'); rect(px+2,py,3,T,'#6fe08f'); rect(px,py,T,2,'#1b7a35'); }
    else if (c==='F'){ rect(px+7,py,2,T,'#ddd'); if(tileAt(tx,ty-1)!=='F'){ rect(px+9,py+1,10,7,'#e23b3b'); rect(px+5,py-2,6,3,'#ffd34d'); } }
  }
  // monedas
  for (const c of coinsList){
    if (c.got) continue;
    const w=Math.abs(Math.sin(performance.now()/180))*6+2;
    const yoff = c.pop? -((20-c.pop)*0.8):0;
    rect(c.x+4-w/2,c.y+yoff,w,10,'#ffd700'); rect(c.x+4-w/2+1,c.y+yoff+1,Math.max(1,w-2),8,'#fff08a');
  }
  // enemigos (hongos marrones)
  for (const e of enemies){
    if (!e.alive){ if(e.squash>0){ rect(e.x,e.y+10,e.w,4,'#7a4a22'); } continue; }
    rect(e.x,e.y,e.w,8,'#8b5a2b'); rect(e.x+1,e.y-2,e.w-2,3,'#8b5a2b');
    rect(e.x+2,e.y+4,3,3,'#fff'); rect(e.x+7,e.y+4,3,3,'#fff'); rect(e.x+3,e.y+5,1,2,'#000'); rect(e.x+8,e.y+5,1,2,'#000');
    rect(e.x+2,e.y+8,8,6,'#f5d7a1');
    const s=Math.floor(performance.now()/150)%2; rect(e.x+(s?0:1),e.y+13,4,2,'#3a2412'); rect(e.x+7-(s?0:1),e.y+13,4,2,'#3a2412');
  }
  drawStivens(player.x,player.y,player.face,player.anim,!player.onGround,state==='dead'?0:player.inv);
  ctx.restore();

  // HUD
  text('STIVENS',10,16,12,'#fff');
  text('PTS '+String(score).padStart(6,'0'),110,16,12);
  text('● x'+coinsGot,230,16,12,'#ffd700');
  text('♥ x'+Math.max(lives,0),310,16,12,'#ff6b6b');
  text('NIVEL '+(level+1),400,16,12);

  // controles táctiles
  if ('ontouchstart' in window || navigator.maxTouchPoints>0){
    ctx.globalAlpha=0.45;
    for (const k in btns){ const b=btns[k]; ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(b.x+b.w/2,b.y+b.h/2,b.w/2,0,7); ctx.fill(); text(b.t,b.x+b.w/2,b.y+b.h/2+7,22,'#fff','center'); }
    ctx.globalAlpha=1;
  }
  if (state==='dead') text('¡Ouch, Stivens!',W/2,H/2,20,'#fff','center');
  if (state==='next'){ shade(); text('¡NIVEL COMPLETADO!',W/2,H/2-10,22,'#ffd700','center'); text('Toca para continuar',W/2,H/2+20,14,'#fff','center'); }
  if (state==='win'){ shade(); text('¡STIVENS GANÓ!',W/2,H/2-20,26,'#ffd700','center'); text('Puntos: '+score,W/2,H/2+10,16,'#fff','center'); text('Toca para volver al inicio',W/2,H/2+36,12,'#fff','center'); }
  if (state==='over'){ shade(); text('GAME OVER',W/2,H/2-10,28,'#ff5a5a','center'); text('Toca para reintentar',W/2,H/2+20,14,'#fff','center'); }
}
function shade(){ ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,W,H); }

function drawTitle(){
  rect(0,H-60,W,60,'#b5651d'); rect(0,H-60,W,8,'#3cb043');
  text('STIVENS',W/2,90,46,'#ffd700','center');
  text('ADVENTURE',W/2,125,28,'#fff','center');
  drawBig(W/2-24,H-60-64,3);
  if (Math.floor(performance.now()/500)%2) text('Toca la pantalla para jugar',W/2,175,14,'#fff','center');
  text('◀ ▶ mover   ▲ saltar   (teclado: flechas + espacio)',W/2,H-8,10,'#fff','center');
}
function drawBig(x,y,s){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); drawStivens(8,0,1,0,false,0); ctx.restore(); }

function loop(){ update(); draw(); requestAnimationFrame(loop); }
loadLevel(0);
loop();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
